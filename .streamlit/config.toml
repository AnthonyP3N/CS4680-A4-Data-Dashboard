# Generated by `python -m ui.theme` from ui/theme.py. Edit the tokens there, not this file.

[theme]
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#3B4CCA"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EDEFF4"
textColor = "#1B2333"
linkColor = "#3B4CCA"
borderColor = "#DCE0E8"
dataframeBorderColor = "#DCE0E8"
codeBackgroundColor = "#EDEFF4"
chartCategoricalColors = ["#3B4CCA", "#0E9F8E", "#D98200", "#D64545", "#7C5CD6", "#2E8B57", "#C2418F", "#596273"]

[theme.dark]
primaryColor = "#8E9CFF"
backgroundColor = "#10141C"
secondaryBackgroundColor = "#1F2532"
textColor = "#E7EAF1"
linkColor = "#8E9CFF"
borderColor = "#2E3545"
dataframeBorderColor = "#2E3545"
codeBackgroundColor = "#1F2532"
chartCategoricalColors = ["#8E9CFF", "#3CC8B4", "#F2B441", "#FF7B7B", "#B39BFF", "#5FD08A", "#F07CC0", "#A6AEC0"]

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false
